<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic RAG PDF Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 25px;
        }
        h2 {
            text-align: center;
            color: #1a73e8;
            margin-top: 0;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #fafafa;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #334155;
        }
        .file-input-group {
            display: flex;
            gap: 10px;
        }
        input[type="file"] {
            flex: 1;
        }
        .response-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
            min-height: 60px;
            color: #333;
            line-height: 1.5;
        }
        .loading {
            color: #1a73e8;
            font-weight: bold;
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .status-msg {
            font-size: 14px;
            margin-top: 8px;
            font-weight: bold;
        }
        .input-group {
            display: flex;
            margin-top: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px 0 0 6px;
            outline: none;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            border: none;
            background: #1a73e8;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .input-group button {
            border-radius: 0 6px 6px 0;
        }
        button:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Smart PDF Assistant 🤖</h2>
        
        <!-- Step 1: Upload Section -->
        <div class="section">
            <div class="section-title">1. Upload PDF Document</div>
            <div class="file-input-group">
                <input type="file" id="pdfFileInput" accept=".pdf" />
                <button onclick="uploadPDF()">Upload</button>
            </div>
            <div class="status-msg" id="uploadStatus"></div>
        </div>

        <!-- Step 2: Question & Answer Section -->
        <div class="section">
            <div class="section-title">2. Ask Questions</div>
            <div class="response-box" id="responseBox">
                Upload a PDF file above and ask any question!
            </div>
            <div class="loading" id="loadingText">Processing... ⏳</div>
            
            <div class="input-group">
                <input type="text" id="questionInput" placeholder="Ask a question..." onkeypress="handleKeyPress(event)" />
                <button onclick="askQuestion()">Ask</button>
            </div>
        </div>
    </div>

    <script>
        // Upload PDF Function
        async function uploadPDF() {
            const fileInput = document.getElementById("pdfFileInput");
            const uploadStatus = document.getElementById("uploadStatus");

            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select a PDF file first!");
                return;
            }

            const selectedFile = fileInput.files[0];
            const maxUploadBytes = 4 * 1024 * 1024;

            if (selectedFile.size > maxUploadBytes) {
                uploadStatus.style.color = "red";
                uploadStatus.innerText = "❌ Please upload a PDF smaller than 4 MB.";
                return;
            }

            uploadStatus.style.color = "#1a73e8";
            uploadStatus.innerText = "Extracting & Embedding PDF... Please wait ⏳";

            try {
                const fileBase64 = await fileToBase64(selectedFile);
                const response = await fetch("/api/upload-json", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        filename: selectedFile.name,
                        file_base64: fileBase64
                    })
                });

                const data = await parseApiResponse(response);

                if (response.ok) {
                    uploadStatus.style.color = "green";
                    uploadStatus.innerText = "✅ " + data.message;
                } else {
                    uploadStatus.style.color = "red";
                    uploadStatus.innerText = "❌ " + (data.detail || "Upload failed.");
                }
            } catch (error) {
                uploadStatus.style.color = "red";
                uploadStatus.innerText = "❌ " + error.message;
                console.error("Upload error:", error);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const result = reader.result || "";
                    resolve(String(result).split(",")[1] || "");
                };
                reader.onerror = () => reject(reader.error || new Error("Could not read the selected file."));
                reader.readAsDataURL(file);
            });
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                askQuestion();
            }
        }

        // Ask Question Function
        async function askQuestion() {
            const questionInput = document.getElementById("questionInput");
            const question = questionInput.value.trim();
            const responseBox = document.getElementById("responseBox");
            const loadingText = document.getElementById("loadingText");

            if (!question) return;

            responseBox.innerText = "";
            loadingText.style.display = "block";
            
            try {
                const response = await fetch("/api/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await parseApiResponse(response);
                
                loadingText.style.display = "none";
                responseBox.innerText = data.answer || "No response received.";
                questionInput.value = "";
                
            } catch (error) {
                loadingText.style.display = "none";
                responseBox.innerText = "Error connecting to the server.";
                console.error("Error:", error);
            }
        }

        async function parseApiResponse(response) {
            const contentType = response.headers.get("content-type") || "";
            if (contentType.includes("application/json")) {
                return response.json();
            }

            const text = await response.text();
            throw new Error(text || `Server returned ${response.status}`);
        }
    </script>

</body>
</html>
